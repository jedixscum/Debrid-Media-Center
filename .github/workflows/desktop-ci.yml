name: Linux desktop test build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse0 libasound2t64
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]" build
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Load Qt Quick UI offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_MULTIMEDIA_PREFERRED_PLUGINS: ffmpeg
        run: python -m pytest -q
      - name: Build Python distribution
        run: python -m build
      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: debrid-media-center-linux-python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14
